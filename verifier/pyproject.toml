[project]
name = "margin-verifier"
version = "0.1.0"
description = "Spike: step-by-step verifier for handwritten algebra/calculus (LaTeX in, verdicts out)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sympy>=1.14.0",
    "latex2sympy2-extended>=1.11.0",
]

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
# Only needed to re-run scripts/compare_parsers.py (the parser bake-off).
compare = [
    "lark>=1.3.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
